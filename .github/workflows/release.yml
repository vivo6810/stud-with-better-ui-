name: AppImage

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  appimage:
    # On Arch, which quick-sharun targets. The image bundles glibc, so the base sets no floor.
    name: AppImage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # The packages Containerfile.appimage installs, so the script needn't start a container.
    container: archlinux:latest
    env:
      STUD_APPIMAGE_IN_CONTAINER: "1"
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git python curl zstd nasm vulkan-headers \
            rust shaderc sdl3 ffmpeg \
            qt6-base qt6-wayland breeze wpewebkit bubblewrap xdg-dbus-proxy openssl libsecret \
            vulkan-icd-loader libglvnd mesa libx11 libxext libxi libxrandr \
            libxcursor libxfixes libxss wayland libxkbcommon libxkbcommon-x11 libdecor \
            systemd-libs pipewire libpulse alsa-lib \
            patchelf strace xorg-server-xvfb desktop-file-utils zsync wget

      - uses: actions/checkout@v7
        with:
          # The released tag, so packages are built from the code it names.
          ref: ${{ env.TAG || github.sha }}

      - name: Version, Rust and the Cargo cache
        uses: ./.github/actions/setup

      - name: Build the AppImage
        env:
          # Anonymous api.github.com requests hit the rate limit on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export STUD_CMAKE_ARGS="-DSTUD_VERSION=${VERSION}"
          packaging/build-appimage.sh

      - name: Validate AppImage contents
        # Its own build, so it's validated on its own terms; build-appimage.sh already
        # counted the shaders.
        run: |
          appimage="$(find build-appimage/packages -name '*.AppImage' | head -1)"
          [ -n "$appimage" ] || { echo "::error::no AppImage was built"; exit 1; }
          chmod +x "$appimage"
          ( cd /tmp && "$OLDPWD/$appimage" --appimage-extract >/dev/null )
          python3 tools/validate-payload.py /tmp/squashfs-root --label "AppImage"
      - name: Test Studio association migration
        run: |
          cmake -S . -B build-appimage -DSTUD_BUILD_TESTS=ON
          cmake --build build-appimage --target stud_studio_associations_test
          ctest --test-dir build-appimage -R '^studio_associations_test$' --output-on-failure --no-tests=error

      - name: Archive matching source code
        run: git archive --format=zip --prefix=Stud/ --output=build-appimage/packages/sourcecode.zip HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            build-appimage/packages/*.AppImage
            build-appimage/packages/sourcecode.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: packages
      - name: Attach standalone AppImage and source code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test -f packages/sourcecode.zip
          test -f packages/Stud-x86_64.AppImage
          gh release upload "$RELEASE_TAG" packages/sourcecode.zip packages/Stud-x86_64.AppImage --clobber
